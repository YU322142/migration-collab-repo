modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "mishanguc_pale_oak_equivalence.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "mishanguc"
type = "required"
versionRange = "[1.6.1,1.7)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "backport"
type = "required"
versionRange = "[1.5,1.6)"
ordering = "AFTER"
side = "BOTH"

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'cctweaked-startup-shutdown-guard'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def computerCraftJar = file(project.computercraft_jar)

dependencies {
    compileOnly files(computerCraftJar)
    testImplementation 'org.ow2.asm:asm:9.8'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
}

def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02X', it) }.join()
}

tasks.register('verifyInputs') {
    doLast {
        assert computerCraftJar.isFile(): "Missing CC:Tweaked JAR: ${computerCraftJar}"
        assert sha256(computerCraftJar).equalsIgnoreCase(project.computercraft_sha256):
                "CC:Tweaked SHA-256 mismatch: ${sha256(computerCraftJar)}"
    }
}

def tomlProperties = [
        'loader_version_range', 'mod_license', 'mod_id', 'mod_version',
        'mod_name', 'mod_authors', 'mod_description', 'neo_version_range',
        'minecraft_version_range', 'computercraft_version_range'
].collectEntries { key -> [key, project.property(key).toString()] }

tasks.named('processResources') {
    inputs.properties(tomlProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(tomlProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyInputs')
    options.encoding = 'UTF-8'
}

tasks.register('bytecodeContractTest', JavaExec) {
    group = 'verification'
    description = 'Pins the exact CC:Tweaked 1.120.0 bytecode patterns repaired by this guard.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.migration.cctweakedguard.CCTweakedBytecodeContractTest'
    systemProperty 'computercraftJar', computerCraftJar.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('bytecodeContractTest')
}

tasks.named('jar') {
    dependsOn tasks.named('verifyInputs')
    archiveFileName = "cctweaked-startup-shutdown-guard-${project.mod_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

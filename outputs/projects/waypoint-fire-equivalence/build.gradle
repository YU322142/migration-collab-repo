plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'waypoint-fire-equivalence'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def tomlProperties = [
    'loader_version_range', 'mod_license', 'mod_id', 'mod_version',
    'mod_name', 'mod_authors', 'mod_description', 'neo_version_range',
    'minecraft_version_range'
].collectEntries { key -> [key, project.property(key).toString()] }

tasks.named('processResources') {
    inputs.properties(tomlProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(tomlProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveFileName = "waypoint-fire-equivalence-${project.mod_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('paritySemanticsTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free parity boundary and legacy migration checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bmt.waypointfire.ParitySemanticsTest'
}

tasks.register('commandArgumentRegistrationContractTest', JavaExec) {
    group = 'verification'
    description = 'Prevents removal of the custom argument wire-registration contract.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bmt.waypointfire.CommandArgumentRegistrationContractTest'
}

tasks.named('check') {
    dependsOn tasks.named('paritySemanticsTest')
    dependsOn tasks.named('commandArgumentRegistrationContractTest')
}

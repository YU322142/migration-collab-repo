plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'create-saveddata-probe'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def createJar = file(project.create_jar)

dependencies {
    compileOnly files(createJar)
}

def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02X', it) }.join()
}

tasks.register('verifyInputs') {
    doLast {
        assert createJar.isFile(): "Missing Create JAR: ${createJar}"
        assert sha256(createJar).equalsIgnoreCase(project.create_sha256):
                "Create SHA-256 mismatch: ${sha256(createJar)}"
    }
}

def replacements = [
        loader_version_range   : loader_version_range,
        mod_license            : mod_license,
        mod_id                 : mod_id,
        mod_version            : mod_version,
        mod_name               : mod_name,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        neo_version_range      : neo_version_range,
        minecraft_version_range: minecraft_version_range,
        create_version_range   : create_version_range
]

tasks.named('processResources') {
    inputs.properties(replacements)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replacements)
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyInputs')
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    dependsOn tasks.named('verifyInputs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'nautilus-alias-adapter'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            jvmArguments = ['-Xmx2G', '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition']
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def iWantJar = file(project.i_want_jar)
dependencies {
    compileOnly files(iWantJar)
    // Keep the upstream mod on the isolated dev runtime for registry probing.
    runtimeOnly files(iWantJar)
}

def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def tomlProperties = [
    'loader_version_range', 'mod_license', 'mod_id', 'mod_version',
    'mod_name', 'mod_authors', 'mod_description', 'neo_version_range',
    'minecraft_version_range'
].collectEntries { key -> [key, project.property(key).toString()] }

tasks.register('verifyInputs') {
    doLast {
        assert iWantJar.isFile(): "Missing I Want My Nautilus JAR: ${iWantJar}"
        assert sha256(iWantJar).equalsIgnoreCase(project.i_want_sha256):
                "I Want My Nautilus SHA-256 mismatch: ${sha256(iWantJar)}"
    }
}

tasks.named('processResources') {
    inputs.properties(tomlProperties)
    filesMatching('META-INF/neoforge.mods.toml') { expand(tomlProperties) }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyInputs')
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    dependsOn tasks.named('verifyInputs')
    archiveFileName = "nautilus-alias-adapter-${project.mod_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

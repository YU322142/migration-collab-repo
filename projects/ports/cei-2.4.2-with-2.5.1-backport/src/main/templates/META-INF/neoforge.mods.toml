modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_github}/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="${mod_github}"
    logoFile="icon.png"
    #credits=""
    authors="${mod_authors}"
    description='''${mod_description}'''

[[mixins]]
    config="${mod_id}.mixins.json"

${integration_mixin_blocks}

#[[accessTransformers]]
    #file="META-INF/accesstransformer.cfg"

[modproperties.${mod_id}]
    "create_dragons_plus:fluid/dye"=true
    "create_dragons_plus:block/fluid_hatch"=true
    "create_dragons_plus:item/blaze_upgrade_smithing_template"=true
    "create_dragons_plus:fluid/dragon_breath"=true

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create_dragons_plus"
    type="required"
    versionRange="${create_dragons_plus_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apothic_enchanting"
    type="optional"
    versionRange="${apothic_enchanting_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apotheosis"
    type="optional"
    versionRange="${apotheosis_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apothic_spawners"
    type="optional"
    versionRange="${apothic_spawners_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="${sable_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="touhou_little_maid"
    type="optional"
    versionRange="[1.2.0,)"
    ordering="AFTER"
    side="BOTH"
